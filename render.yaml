databases:
  - name: patidestek-db
    plan: free
    databaseName: patidestek
    user: patidestek

services:
  - type: web
    name: patidestek-api
    runtime: docker
    rootDir: PatiDestekAPI
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: PGHOST
        fromDatabase:
          name: patidestek-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: patidestek-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: patidestek-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: patidestek-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: patidestek-db
          property: password
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: PatiDestekAPI
      - key: Jwt__Audience
        value: PatiDestekAPIUsers
      - key: Jwt__ExpireMinutes
        value: "60"
      - key: EmailSettings__Email
        sync: false
      - key: EmailSettings__AppPassword
        sync: false
      - key: EmailSettings__SmtpServer
        value: smtp.gmail.com
      - key: EmailSettings__Port
        value: "587"
      - key: SeedSuperAdmin__Email
        sync: false
      - key: SeedSuperAdmin__Password
        sync: false
